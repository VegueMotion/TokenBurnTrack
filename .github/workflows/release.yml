name: release

on:
  push:
    branches: [stable]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_ID: io.VagueMotion.TokenBurnTrack

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that the version is not tagged yet
        id: check
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Bump the version in Cargo.toml before releasing."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  appimage:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git gcc g++ clang \
            cmake pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev \
            libfontconfig1-dev libfreetype-dev file >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --default-toolchain none --profile minimal
      - uses: actions/checkout@v7
      - name: Build
        run: scripts/build-appimage.sh --host
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build-dir \
            "packaging/flatpak/$APP_ID.yml"
          mkdir -p dist
          flatpak build-bundle repo "dist/TokenBurnTrack-$VERSION-$(uname -m).flatpak" "$APP_ID" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: scripts\build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/

  macos:
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          xcodebuild -downloadComponent MetalToolchain
          scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/

  release:
    needs: [version, appimage, flatpak, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Tag the commit and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          PRERELEASE=
          case $TAG in *-*) PRERELEASE=--prerelease ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" $PRERELEASE

  readme-links:
    needs: [version, release]
    if: ${{ !contains(needs.version.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Point the README download links at the new release
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          VERSION=${TAG#v}
          sed -i -E "s#releases/download/v[0-9][^/]*/TokenBurnTrack-[0-9][^-]*-#releases/download/$TAG/TokenBurnTrack-$VERSION-#g" README.md
          grep -q "releases/download/$TAG/" README.md || { echo "::error::No README download links matched"; exit 1; }
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Point README download links at $TAG"
          for _ in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master
          done
          exit 1
