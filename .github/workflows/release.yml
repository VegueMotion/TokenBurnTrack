name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  APP_ID: io.VagueMotion.TokenBurnTrack

jobs:
  appimage:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git gcc g++ clang \
            cmake pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev \
            libfontconfig1-dev libfreetype-dev file >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --default-toolchain none --profile minimal
      - uses: actions/checkout@v7
      - name: Build
        run: scripts/build-appimage.sh --host
      - uses: actions/upload-artifact@v7
        with:
          name: release-appimage
          path: dist/

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build-dir \
            "packaging/flatpak/$APP_ID.yml"
          mkdir -p dist
          flatpak build-bundle repo "dist/TokenBurnTrack-$VERSION-$(uname -m).flatpak" "$APP_ID" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: dist/

  windows:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: scripts\build-windows.ps1
      - uses: actions/upload-artifact@v7
        id: unsigned
        with:
          name: ${{ env.SIGN == 'true' && 'windows-unsigned' || 'release-windows' }}
          path: dist/
      - name: Sign
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/
      - uses: actions/upload-artifact@v7
        if: env.SIGN == 'true'
        with:
          name: release-windows
          path: signed/

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          xcodebuild -downloadComponent MetalToolchain
          scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/

  release:
    needs: [appimage, flatpak, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=
          case $GITHUB_REF_NAME in *-*) PRERELEASE=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" $PRERELEASE
