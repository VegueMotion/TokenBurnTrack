stages: [build, release]

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

variables:
  APP_ID: io.VagueMotion.TokenBurnTrack

.dist:
  artifacts:
    paths: [dist/]
    expire_in: 1 week

appimage:
  stage: build
  extends: .dist
  image: docker.io/library/ubuntu:22.04
  script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends ca-certificates curl git gcc g++ clang
      cmake pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev
      libfontconfig1-dev libfreetype-dev file >/dev/null
    - curl -sSf https://sh.rustup.rs | sh -s -- -y -q --default-toolchain none --profile minimal
    - scripts/build-appimage.sh --host

flatpak:
  stage: build
  extends: .dist
  image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
  script:
    - VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
    - >-
      flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build-dir
      packaging/flatpak/$APP_ID.yml
    - mkdir -p dist
    - >-
      flatpak build-bundle repo dist/TokenBurnTrack-$VERSION-$(uname -m).flatpak $APP_ID
      --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

windows:
  stage: build
  extends: .dist
  tags: [saas-windows-medium-amd64]
  script:
    - $ProgressPreference = 'SilentlyContinue'
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y -q --default-toolchain none --profile minimal
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1

macos:
  stage: build
  extends: .dist
  tags: [saas-macos-medium-m1]
  image: macos-26-xcode-26
  script:
    - xcodebuild -downloadComponent MetalToolchain
    - curl -sSf https://sh.rustup.rs | sh -s -- -y -q --default-toolchain none --profile minimal
    - export PATH="$HOME/.cargo/bin:$PATH"
    - scripts/build-macos.sh

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.132.0
  needs: [appimage, flatpak, windows, macos]
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - glab release create "$CI_COMMIT_TAG" dist/* --name "$CI_COMMIT_TAG" --use-package-registry
