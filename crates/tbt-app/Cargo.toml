[package]
name = "tbt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tbt-adapters.workspace = true
tbt-core.workspace = true
tbt-store.workspace = true
tbt-pricing.workspace = true
tbt-collector.workspace = true
crossbeam-channel.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
anyhow.workspace = true
jiff.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
gpui-component.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, features = ["background"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true
